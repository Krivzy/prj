# MCC runs inside Paper. Keep loopback unless you explicitly configure LAN + HTTPS.
web:
  host: 127.0.0.1
  # Dynmap's standard TCP port. Use your host's assigned web/Dynmap port if different.
  # MCC and Dynmap cannot listen on the same address and port at the same time.
  port: 8123
  allow-lan: false
  public-origin: ''
  secure-cookie: false
# First Owner: an online operator receives a private, one-time chat link.
# Console fallback: mcc setup <onlinePlayer> (target must be an operator or have mcc.setup).
# Existing auth.bootstrap-admin values are ignored. Public default credentials are never created.
performance:
  profile: balanced
modules:
  chat: true
  events: true
  automations: true
  map: true
  oreMonitor: true
  integrations: true
  metrics: true
  playerSnapshots: true
  entitySnapshots: true
  timeline: true
  catalog: true
  console: true
game:
  max-spawn-count: 128
  max-active-events: 3
storage:
  retention-days: 7
console:
  # Exact Minecraft command roots. Namespace syntax, execute, stop/reload and OS commands are blocked.
  allowed-commands: [list, say, time, weather, difficulty, seed, help, version, plugins]
