# MCC runs inside Paper. Keep loopback unless you explicitly configure LAN + HTTPS.
web:
  host: 127.0.0.1
  port: 8080
  allow-lan: false
  public-origin: ''
  secure-cookie: false
auth:
  # Creates admin with the initial password admin on an empty loopback installation only.
  # Change the initial password in My account before allowing remote access.
  # Existing users are preserved. false or LAN mode uses private-token setup instead.
  bootstrap-admin: true
performance:
  profile: balanced
modules:
  chat: true
  events: true
  automations: true
  map: true
game:
  max-spawn-count: 128
  max-active-events: 3
storage:
  retention-days: 7
console:
  # Exact Minecraft command roots. Namespace syntax, execute, stop/reload and OS commands are blocked.
  allowed-commands: [list, say, time, weather, difficulty, seed, help, version, plugins]
