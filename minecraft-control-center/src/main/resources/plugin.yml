name: MinecraftControlCenter
version: '${version}'
main: dev.mcc.MccPlugin
api-version: '26.1.2'
softdepend: [LuckPerms, CoreProtect, AdvancedBan, AdvancedBanZ, LiteBans, BanManager, LibertyBans, GrimAC]
description: Embedded real-time Minecraft administration with authenticated web dashboard
authors: [MCC]
commands:
  mcc:
    description: Show MCC status or privately initialize the panel from an operator account
permissions:
  mcc.setup:
    description: Initialize the panel using this online Minecraft identity
    default: op
  mcc.status:
    default: op
  mcc.punishments:
    default: op
    children:
      mcc.status: true
      mcc.punishments.warn: true
      mcc.punishments.kick: true
      mcc.punishments.mute: true
      mcc.punishments.ban: true
      mcc.punishments.revoke: true
  mcc.punishments.warn:
    default: op
  mcc.punishments.kick:
    default: op
  mcc.punishments.mute:
    default: op
  mcc.punishments.ban:
    default: op
  mcc.punishments.revoke:
    default: op
