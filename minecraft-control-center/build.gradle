plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'dev.mcc'
version = '0.11.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:26.3-R0.1-20261004.024323-9'
    implementation 'io.undertow:undertow-core:2.3.20.Final'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.1'
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.82'
    implementation 'org.yaml:snakeyaml:2.5'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.spigotmc:spigot-api:26.3-R0.1-20261004.024323-9'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xlint:deprecation']
}

def windows = System.getProperty('os.name').toLowerCase().contains('windows')
def skipFrontend = providers.gradleProperty('skipFrontend').map { it.toBoolean() }.orElse(false)
def coreFoundation = providers.gradleProperty('coreFoundation').map { file(it) }.orElse(file('generated/core-engine/MCC-Core-engine-0.2.0-26.3.jar'))
def coreFoundationSha = '86c96263ba9a6257cc8b03e8e8fd8f90ee03fedb396918ed1fa1f74ebe196223'
def hashStream = { InputStream input ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    byte[] buffer = new byte[262144]
    for (int count; (count = input.read(buffer)) >= 0;) { if (count > 0) digest.update(buffer, 0, count) }
    digest.digest().encodeHex().toString()
}

tasks.register('verifyCoreFoundation') {
    group = 'verification'
    description = 'Verify the pinned MCC Core engine before embedding it without unpacking it.'
    inputs.file(coreFoundation)
    doLast {
        def foundation = coreFoundation.get()
        if (!foundation.isFile() || foundation.length() != 55980330L) throw new GradleException('Build MCC Core first: see core-engine/README.md; the exact pinned engine is required.')
        def hash = foundation.withInputStream { hashStream(it) }
        if (hash != coreFoundationSha) throw new GradleException('MCC Core engine SHA-256 does not match the verified release foundation.')
        new java.util.jar.JarFile(foundation).withCloseable { jar ->
            def entry = jar.getJarEntry('META-INF/mcc-engine.properties')
            if (entry == null || entry.size > 4096L) throw new GradleException('MCC Core engine provenance is absent or oversized.')
            def metadata = new Properties()
            jar.getInputStream(entry).withCloseable { input ->
                byte[] bytes = input.readNBytes(4097)
                if (bytes.length > 4096) throw new GradleException('MCC Core engine provenance exceeds its bound.')
                metadata.load(new ByteArrayInputStream(bytes))
            }
            [ 'engine.name': 'MCC Core', 'engine.version': '0.2.0', 'upstream.name': 'Paper', 'upstream.minecraft': '26.3',
              'upstream.commit': '46d4834e8e2ec4af9dcfa028076fb16dfb8a3911',
              'patchset.sha256': '3d42ace4d8f3a14bb7765cb173da0bcd06aa7a6533bd33e4e8892a50d0ca3c6f',
              'tick.owner': 'paper-main-thread',
              'features': 'bounded-ore-scratch,nbt-fast-entries,contiguous-long-encoding,chunk-snapshot-loops,palette-layout' ].each { key, expected ->
                if (metadata.getProperty(key) != expected) throw new GradleException("MCC Core provenance mismatch: ${key}")
            }
        }
    }
}
def npmCommand = { List<String> arguments ->
    if (providers.gradleProperty('npmCli').isPresent()) {
        return [providers.gradleProperty('nodeExecutable').getOrElse('node'), providers.gradleProperty('npmCli').get()] + arguments
    }
    def npm = providers.gradleProperty('npmExecutable').getOrElse(windows ? 'npm.cmd' : 'npm')
    return windows ? ['cmd.exe', '/d', '/c', npm] + arguments : [npm] + arguments
}

tasks.register('frontendInstall', Exec) {
    group = 'build'
    description = 'Install pinned frontend dependencies; Node.js is a build dependency only.'
    workingDir 'frontend'
    inputs.files('frontend/package.json', 'frontend/package-lock.json')
    outputs.file('frontend/node_modules/.package-lock.json')
    commandLine npmCommand(['ci', '--no-audit', '--no-fund'])
    onlyIf { !skipFrontend.get() }
}

tasks.register('frontendBuild', Exec) {
    group = 'build'
    description = 'Typecheck and compile static web assets embedded in the plugin JAR.'
    dependsOn 'frontendInstall'
    workingDir 'frontend'
    inputs.files(fileTree('frontend') {
        exclude 'node_modules/**', 'dist/**', '*.tsbuildinfo'
    })
    outputs.dir('frontend/dist')
    commandLine npmCommand(['run', 'build'])
    onlyIf { !skipFrontend.get() }
}

tasks.register('frontendTest', Exec) {
    group = 'verification'
    description = 'Verify permissions, action confirmation, API handling and real metric history.'
    dependsOn 'frontendInstall'
    workingDir 'frontend'
    inputs.files(fileTree('frontend/src'), fileTree('frontend/tests'), 'frontend/package.json')
    commandLine npmCommand(['run', 'test'])
    onlyIf { !skipFrontend.get() }
}

tasks.named('processResources') {
    dependsOn 'frontendBuild', 'verifyCoreFoundation'
    from('frontend/dist') { into 'web' }
    from(coreFoundation) { into 'mcc-core'; rename { 'engine-0.2.0.jar' } }
    from('core-engine') { include 'LICENSE.md', 'THIRD-PARTY.md'; into 'META-INF/mcc-core-licenses' }
    from('core-engine/licenses') { include '*.md', '*.txt'; into 'META-INF/mcc-core-licenses/upstream' }
    filesMatching('plugin.yml') { expand(version: project.version) }
    doFirst {
        if (!file('frontend/dist/index.html').isFile()) {
            throw new GradleException('Built frontend is missing. Run frontendBuild, or supply frontend/dist before -PskipFrontend=true.')
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { events 'failed', 'skipped'; exceptionFormat = 'full' }
}

tasks.named('jar') { archiveClassifier = 'unshaded' }
tasks.named('shadowJar') {
    archiveFileName = 'MinecraftControlCenter.jar'
    archiveClassifier = ''
    manifest { attributes 'Main-Class': 'dev.mcc.launcher.LauncherMain' }
    mergeServiceFiles()
    relocate 'org.yaml.snakeyaml', 'dev.mcc.shaded.yaml'
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/INDEX.LIST', 'module-info.class', 'META-INF/versions/**/module-info.class'
    relocate 'io.undertow', 'dev.mcc.lib.undertow'
    relocate 'org.xnio', 'dev.mcc.lib.xnio'
    relocate 'org.jboss', 'dev.mcc.lib.jboss'
    relocate 'org.wildfly', 'dev.mcc.lib.wildfly'
    relocate 'io.smallrye.common', 'dev.mcc.lib.smallrye'
    relocate 'com.fasterxml.jackson', 'dev.mcc.lib.jackson'
    // SQLite keeps its original package because native JNI entry points depend on it.
    // Bouncy Castle keeps its package to preserve cryptographic implementation compatibility.
}
tasks.named('assemble') { dependsOn 'shadowJar' }

tasks.register('distributionChecksum') {
    group = 'build'
    dependsOn 'shadowJar'
    def artifact = tasks.shadowJar.archiveFile
    inputs.file(artifact)
    outputs.file(layout.buildDirectory.file('libs/MinecraftControlCenter.jar.sha256'))
    doLast {
        def hash = artifact.get().asFile.withInputStream { hashStream(it) }
        layout.buildDirectory.file('libs/MinecraftControlCenter.jar.sha256').get().asFile.setText("${hash}  MinecraftControlCenter.jar\n", 'UTF-8')
    }
}
tasks.named('assemble') { dependsOn 'distributionChecksum' }

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('verifyDistribution') {
    group = 'verification'
    description = 'Verify that the deliverable contains plugin metadata, backend, dependencies and frontend.'
    dependsOn 'shadowJar'
    doLast {
        new java.util.jar.JarFile(tasks.shadowJar.archiveFile.get().asFile).withCloseable { jar ->
            ['plugin.yml', 'dev/mcc/MccPlugin.class', 'web/index.html', 'org/sqlite/JDBC.class', 'mcc-core/engine-0.2.0.jar',
             'META-INF/mcc-core-licenses/LICENSE.md', 'META-INF/mcc-core-licenses/THIRD-PARTY.md'].each { name ->
                if (jar.getJarEntry(name) == null) throw new GradleException("Missing JAR entry: ${name}")
            }
            def names = jar.entries().collect { it.name }
            if (!names.any { it.startsWith('web/assets/') && it.endsWith('.js') }) throw new GradleException('Missing compiled JavaScript')
            if (names.any { it.startsWith('org/bukkit/') || it.startsWith('io/papermc/paper/') }) throw new GradleException('Paper API must not be bundled')
            def engine = jar.getJarEntry('mcc-core/engine-0.2.0.jar')
            if (engine.size != 55980330L || jar.getInputStream(engine).withCloseable { hashStream(it) } != coreFoundationSha) throw new GradleException('Bundled MCC Core engine is not the pinned verified foundation.')
        }
    }
}
tasks.named('check') { dependsOn 'verifyDistribution', 'frontendTest' }
